<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ULTRAKILL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #1a1a1a, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      color: white;
      text-align: center;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255,255,255,0.1);
      border-top: 5px solid #ff0000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #game-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: black;
    }

    #error-link {
      display: none;
      margin-top: 15px;
      color: #ff4444;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div id="status-text">MANKIND IS DEAD. BLOOD IS FUEL. HELL IS FULL.</div>
    <a id="error-link" href="https://helpdesk.sentinet.co.za/resources/semag/ultrakill/index.html" target="_blank">
      Connection Reset? Click here to open game directly.
    </a>
  </div>

  <iframe
    id="game-frame"
    src="https://helpdesk.sentinet.co.za/resources/semag/ultrakill/index.html"
    allow="autoplay; fullscreen; keyboard; pointer-lock"
    referrerpolicy="no-referrer"
    allowfullscreen
  ></iframe>

  <script src="ultrakill.js"></script>
</body>
</html>
